[project]
name = "nasdaq100-pe"
version = "0.1.0"
description = "纳指100估值看板（本机个人使用）"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ndx-pe = "nasdaq100_pe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasdaq100_pe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
